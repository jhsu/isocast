[package]
name = "isocast-platform-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux back end for Isocast: monotonic clock, wgpu frames, GStreamer file writing."

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1.0.104"
# The xdg-desktop-portal ScreenCast session for screens (Wayland).
ashpd = { version = "0.13.13", features = ["screencast"] }
enumflags2 = "0.7"
# Encoding and muxing (later capture too): one stable C API for NVENC,
# VA-API and x264, fragmented MP4/MOV, PipeWire and V4L2.
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.4"
isocast-engine = { path = "../isocast-engine" }
isocast-protocol = { path = "../isocast-protocol" }
# Its portable stand-in until Linux shares surfaces (DMA-BUF).
isocast-surfaces = { path = "../isocast-surfaces" }
libc = "0.2"
# The portal session runs on its own small runtime.
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread"] }
# Displays, listed from the compositor's outputs.
wayland-client = "0.31.15"
# Pinned like the engine's.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
